<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dentixpert Pro</title>
<!-- icônes en SVG inline -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --color-primary:#176B3A;--color-primary-dark:#0f4d29;--color-primary-light:#2EA85A;
  --color-accent:#E87722;--color-bg:#F8F7F4;--color-sidebar:#111111;--color-card:#FFFFFF;
  --color-border:#EEEEEE;--color-text:#1A1A1A;--color-text-muted:#888888;--color-success:#2EA85A;
  --color-danger:#DC2626;--color-warning:#F59E0B;--color-info:#3B82F6;--color-violet:#7C3AED;--color-rose:#DB2777;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans',sans-serif;}
body{background:var(--color-bg);color:var(--color-text);font-size:14px;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:8px;}::-webkit-scrollbar-thumb:hover{background:#bbb;}
.app{display:flex;min-height:100vh;}
.sidebar{width:240px;background:var(--color-sidebar);color:#fff;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 24px;gap:20px;position:sticky;top:0;z-index:40;}
.content{padding:32px;flex:1;}
.sb-head{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.sb-title{font-weight:700;font-size:16px;line-height:1.1;}
.sb-sub{font-size:11px;color:#888;margin-top:2px;}
.sb-nav{flex:1;padding:14px 12px;overflow-y:auto;}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#bbb;font-size:13.5px;font-weight:500;margin-bottom:3px;position:relative;transition:.13s;width:100%;text-align:left;}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-item.active{background:rgba(46,168,90,.15);color:var(--color-primary-light);}
.sb-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--color-primary-light);border-radius:0 3px 3px 0;}
.sb-item i{font-size:18px;width:20px;text-align:center;}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;}
.sb-foot-info{flex:1;min-width:0;}
.sb-foot-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-logout{color:#888;font-size:18px;padding:6px;border-radius:7px;}
.sb-logout:hover{color:#fff;background:rgba(255,255,255,.08);}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;width:38px;height:38px;font-size:13px;}
.tb-title{font-weight:700;font-size:18px;}
.tb-search{flex:1;max-width:420px;position:relative;}
.tb-search input{width:100%;border:1px solid var(--color-border);border-radius:9px;padding:9px 14px 9px 38px;background:var(--color-bg);outline:none;transition:.15s;}
.tb-search input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(23,107,58,.10);background:#fff;}
.tb-search>i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#aaa;font-size:17px;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:18px;}
.tb-date{font-size:13px;color:var(--color-text-muted);font-weight:500;text-transform:capitalize;}
.tb-bell{position:relative;font-size:21px;color:#555;padding:4px;}
.tb-bell:hover{color:#111;}
.tb-bell .dot{position:absolute;top:-3px;right:-3px;background:var(--color-danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.search-results{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--color-border);border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.12);overflow:hidden;z-index:60;}
.search-res-item{padding:10px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #f4f4f4;cursor:pointer;}
.search-res-item:hover{background:var(--color-bg);}.search-res-item:last-child{border-bottom:none;}
.card{background:var(--color-card);border:1px solid var(--color-border);border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.card-pad{padding:20px;}
.kpi{padding:20px;display:flex;flex-direction:column;gap:2px;position:relative;}
.kpi-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px;}
.kpi-val{font-size:27px;font-weight:700;line-height:1;}
.kpi-lbl{font-size:12.5px;color:var(--color-text-muted);font-weight:500;}
.kpi-var{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-top:5px;}
.kpi-var.up{color:var(--color-success);}.kpi-var.down{color:var(--color-danger);}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:1fr 1fr;}.g6040{grid-template-columns:60% calc(40% - 16px);}.g5050{grid-template-columns:1fr 1fr;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.link-btn{color:var(--color-primary);font-size:13px;font-weight:600;}
.link-btn:hover{text-decoration:underline;}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;font-size:11px;font-weight:600;padding:3px 10px;white-space:nowrap;}
.role-badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px;transition:.13s;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-pri{background:var(--color-primary);color:#fff;}.btn-pri:hover:not(:disabled){background:var(--color-primary-dark);}
.btn-sec{background:#F0F0F0;border:1px solid var(--color-border);color:#333;}.btn-sec:hover{background:#e8e8e8;}
.btn-dan{background:var(--color-danger);color:#fff;}.btn-dan:hover{background:#b91c1c;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-ghost{color:#666;padding:7px;border-radius:7px;}.btn-ghost:hover{background:var(--color-bg);color:#111;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{background:#F5F5F5;text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#777;padding:11px 14px;}
.tbl td{padding:12px 14px;border-bottom:1px solid #f2f2f2;font-size:13.5px;}
.tbl tr:nth-child(even) td{background:#FAFAFA;}
.tbl tr:hover td{background:#F0FDF4;}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;}
.row-click{cursor:pointer;}
.pills{display:flex;gap:8px;flex-wrap:wrap;}
.pill{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--color-border);color:#666;}
.pill:hover{border-color:var(--color-primary-light);color:var(--color-primary);}
.pill.on{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.fld label{font-size:12.5px;font-weight:600;color:#444;}
.fld label .req{color:var(--color-danger);}
.inp{border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;outline:none;transition:.15s;background:#fff;width:100%;}
.inp:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(23,107,58,.12);}
textarea.inp{resize:vertical;min-height:64px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--color-border);margin-bottom:22px;overflow-x:auto;}
.tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:#888;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:#333;}.tab.on{color:var(--color-primary);border-bottom-color:var(--color-primary);}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F8F7F4 0%,#eef3ef 100%);position:relative;overflow:hidden;}
.login-wrap::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(46,168,90,.10),transparent 70%);top:-200px;right:-150px;}
.login-wrap::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(232,119,34,.08),transparent 70%);bottom:-180px;left:-120px;}
.login-card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.10);padding:42px 40px;width:410px;position:relative;z-index:2;}
.login-logo{width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;}
.login-card h1{text-align:center;font-size:22px;font-weight:700;}
.login-card .sub{text-align:center;color:var(--color-text-muted);font-size:13px;margin:4px 0 26px;}
.role-pick{display:grid;gap:9px;margin-top:8px;}
.role-opt{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1.5px solid var(--color-border);border-radius:12px;text-align:left;transition:.13s;width:100%;}
.role-opt:hover{border-color:var(--color-primary-light);background:#F0FDF4;}
.role-opt-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
.role-opt-t{font-weight:700;font-size:14px;}
.role-opt-d{font-size:11.5px;color:var(--color-text-muted);margin-top:1px;}
/* Odontogram amélioré */
.odo{display:flex;flex-direction:column;gap:4px;align-items:center;padding:8px;}
.odo-quad-lbl{font-size:10px;color:#bbb;font-weight:700;letter-spacing:1px;}
.odo-row{display:flex;gap:4px;align-items:flex-end;}
.odo-gap{width:18px;}
.tooth{width:34px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:.12s;}
.tooth:hover{transform:translateY(-3px);}
.tooth-shape{width:30px;height:38px;border-radius:7px 7px 9px 9px;border:1.5px solid #d8d8d8;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:.12s;}
.tooth:hover .tooth-shape{box-shadow:0 4px 10px rgba(0,0,0,.15);}
.tooth-num{font-size:9.5px;font-weight:700;color:#aaa;}
.tooth-crown-dot{position:absolute;top:3px;width:7px;height:7px;border-radius:50%;}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:18px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#555;}
.legend-sw{width:14px;height:14px;border-radius:4px;border:1.5px solid #ddd;}
.modal-bg{position:fixed;inset:0;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fade .15s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:pop .18s;}
.modal.wide{max-width:780px;}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:12px;}
.modal-head h3{font-size:17px;font-weight:700;flex:1;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--color-border);display:flex;gap:10px;justify-content:flex-end;}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:#fff;border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:13px 17px;display:flex;align-items:center;gap:11px;min-width:280px;max-width:380px;border-left:4px solid #ccc;animation:slidein .2s;font-size:13.5px;font-weight:500;}
@keyframes slidein{from{transform:translateX(120%)}to{transform:translateX(0)}}
.toast.success{border-left-color:var(--color-success);}.toast.error{border-left-color:var(--color-danger);}.toast.warning{border-left-color:var(--color-warning);}
.toast i{font-size:20px;}
.toast.success i{color:var(--color-success);}.toast.error i{color:var(--color-danger);}.toast.warning i{color:var(--color-warning);}
.kcol{border-radius:14px;padding:14px;min-height:340px;}
.kcol-head{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.kcard{background:#fff;border-radius:11px;padding:13px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.kcard-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.agenda-grid{display:grid;grid-template-columns:64px 1fr;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--color-border);}
.ag-hour{padding:6px 8px;font-size:11px;color:#999;text-align:right;border-bottom:1px solid #f4f4f4;border-right:1px solid #f4f4f4;height:56px;}
.ag-slot{border-bottom:1px solid #f4f4f4;min-height:56px;position:relative;padding:3px;}
.ag-slot:hover{background:#F0FDF4;cursor:pointer;}
.ag-evt{border-radius:7px;padding:5px 9px;font-size:11.5px;color:#fff;cursor:pointer;border-left:3px solid rgba(0,0,0,.25);margin-bottom:3px;}
.ag-evt b{display:block;font-size:12px;}
.empty{text-align:center;padding:44px 20px;color:var(--color-text-muted);}
.empty i{font-size:46px;color:#ddd;display:block;margin-bottom:12px;}
.empty p{font-size:14px;margin-bottom:16px;}
.timer-red{color:var(--color-danger);font-weight:700;}
.timer-org{color:var(--color-accent);font-weight:600;}
.timer-grn{color:var(--color-success);font-weight:600;}
.notif-panel{position:absolute;top:48px;right:0;width:360px;background:#fff;border:1px solid var(--color-border);border-radius:13px;box-shadow:0 12px 40px rgba(0,0,0,.15);z-index:70;overflow:hidden;}
.notif-item{padding:12px 16px;border-bottom:1px solid #f4f4f4;display:flex;gap:11px;align-items:flex-start;cursor:pointer;}
.notif-item:hover{background:var(--color-bg);}.notif-item.unread{background:#F0FDF4;}
.notif-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.muted{color:var(--color-text-muted);}
.divider{height:1px;background:var(--color-border);margin:20px 0;}
.bal-card{border-radius:13px;padding:18px;}
.progress{height:9px;background:#eee;border-radius:8px;overflow:hidden;margin-top:10px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--color-primary-light),var(--color-primary));border-radius:8px;transition:width .5s;}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.bar-pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center;}
.bar{width:16px;border-radius:4px 4px 0 0;transition:height .5s;min-height:2px;}
.bar-lbl{font-size:11px;color:#999;font-weight:600;}
.donut-legend{display:flex;flex-direction:column;gap:9px;}
.donut-leg-item{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.acte-pick-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--color-border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:.1s;}
.acte-pick-item:hover{border-color:var(--color-primary-light);background:#F0FDF4;}
.alert-box{padding:11px 14px;border-radius:9px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;}
.toggle{display:inline-flex;gap:6px;}
.tog-opt{padding:7px 16px;border:1px solid #E0E0E0;font-size:13px;font-weight:600;color:#666;background:#fff;}
.tog-opt:first-child{border-radius:8px 0 0 8px;}
.tog-opt:last-child{border-radius:0 8px 8px 0;border-left:none;}
.tog-opt.on{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.g6040,.g5050,.g3,.g2{grid-template-columns:1fr;}}

.week-grid{display:grid;grid-template-columns:54px repeat(7,1fr);background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--color-border);}
.week-head{padding:10px 6px;text-align:center;font-size:12px;font-weight:700;border-bottom:1px solid #f0f0f0;border-left:1px solid #f4f4f4;}
.week-head.today{background:#F0FDF4;color:#176B3A;}
.week-hour{padding:4px 6px;font-size:10.5px;color:#aaa;text-align:right;border-bottom:1px solid #f6f6f6;border-right:1px solid #f4f4f4;height:46px;}
.week-cell{border-bottom:1px solid #f6f6f6;border-left:1px solid #f6f6f6;min-height:46px;padding:2px;position:relative;}
.week-cell:hover{background:#F0FDF4;cursor:pointer;}
.week-evt{font-size:10px;border-radius:5px;padding:2px 5px;color:#fff;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.month-dayhead{text-align:center;font-size:11.5px;font-weight:700;color:#999;padding:4px;}
.month-cell{background:#fff;border:1px solid var(--color-border);border-radius:10px;min-height:92px;padding:7px;display:flex;flex-direction:column;gap:3px;}
.month-cell.other{background:#fafafa;opacity:.5;}
.month-cell.today{border-color:#176B3A;border-width:2px;}
.month-daynum{font-size:12px;font-weight:700;color:#666;}
.month-evt{font-size:9.5px;border-radius:4px;padding:1px 5px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;}
.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:40px;}
.pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#999;cursor:pointer;font-size:18px;}
.tooth-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
.tooth-pick-btn{aspect-ratio:1;border:1.5px solid #e0e0e0;border-radius:7px;font-size:11px;font-weight:600;color:#888;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.1s;background:#fff;}
.tooth-pick-btn:hover{border-color:#2EA85A;}
.tooth-pick-btn.on{background:#176B3A;color:#fff;border-color:#176B3A;}
.daterange{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.daterange input{border:1px solid #E0E0E0;border-radius:8px;padding:7px 10px;font-size:13px;}
.editable-cell{cursor:pointer;border-radius:6px;padding:2px 6px;transition:.1s;}
.editable-cell:hover{background:#F0FDF4;outline:1px dashed #2EA85A;}


.status-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:.1s;}
.status-btn:hover{filter:brightness(.95);transform:translateY(-1px);}

/* ════════ MOBILE ════════ */
@media(max-width:768px){
  .app{flex-direction:column;}
  .sidebar{display:none;}
  .main{margin-left:0!important;padding-bottom:68px;}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:200;padding:0 14px;height:54px;}
  .tb-title{font-size:16px;}
  .tb-search{display:none;}
  .tb-date{display:none;}
  .content{padding:14px;margin-top:54px;}
  /* Bottom nav */
  .bottom-nav{display:flex!important;}
  /* Grids */
  .g4,.g3{grid-template-columns:1fr 1fr!important;}
  .g6040,.g5050,.g2{grid-template-columns:1fr!important;}
  /* KPI */
  .kpi{padding:12px!important;}
  .kpi-val{font-size:18px!important;}
  /* Tables */
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .card table{min-width:500px;}
  /* Modal plein écran */
